<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>speech_project</title>
  <style>
    body {
      font-family: -apple-system, system-ui, sans-serif;
      max-width: 640px;
      margin: 40px auto;
      padding: 0 20px;
      color: #222;
    }
    h1 { font-size: 24px; margin-bottom: 4px; }
    p.sub { color: #666; margin-top: 0; }
    button {
      font-size: 16px;
      padding: 10px 20px;
      margin-right: 8px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: #f6f6f6;
      cursor: pointer;
    }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    button.primary { background: #0a84ff; color: white; border-color: #0a84ff; }
    #status {
      margin: 16px 0;
      padding: 10px 14px;
      background: #f0f0f0;
      border-radius: 6px;
      font-family: ui-monospace, monospace;
    }
    #log {
      margin-top: 20px;
      font-family: ui-monospace, monospace;
      font-size: 13px;
      background: #111;
      color: #6f6;
      padding: 12px;
      border-radius: 6px;
      height: 280px;
      overflow-y: auto;
    }
    #log div { white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>speech_project</h1>
  <p class="sub">browser client · talks to the Pipecat agent over LiveKit</p>

  <button id="connect" class="primary">Connect</button>
  <button id="disconnect" disabled>Disconnect</button>

  <div id="status">idle</div>
  <div id="log"></div>

  <script src="https://cdn.jsdelivr.net/npm/livekit-client@2.5.6/dist/livekit-client.umd.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
